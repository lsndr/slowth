<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3e6cf">
<title>Slowth</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<style>
  :root {
    --bg: #f3e6cf;
    --card: #3b2f26;
    --card-text: #f8ecd6;
    --muted: #8a7660;
    --accent: #d9534f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1a16; --card: #3b2f26; --muted: #a39078; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
  }
  #app { position: fixed; inset: 0; height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  /* Timer card */
  #card {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(86vw, 340px); padding: 34px 12px 30px;
    background: var(--card); color: var(--card-text);
    border-radius: 28px; text-align: center;
    box-shadow: 0 14px 0 rgba(0,0,0,.12), 0 24px 40px rgba(0,0,0,.18);
  }
  #time { font-size: clamp(44px, 14vw, 62px); font-weight: 700; letter-spacing: .02em; font-variant-numeric: tabular-nums; line-height: 1; }
  #time small { font-size: .55em; opacity: .7; }
  #card.stopped #time { color: #ffd37a; }

  #grip { position: absolute; left: 50%; width: 120px; margin-left: -60px; height: 6px; border-radius: 3px; background: rgba(127,127,127,.28); opacity: 0; transition: opacity .4s; overflow: hidden; }
  #grip.show { opacity: 1; }
  #grip span { display: block; height: 100%; width: 100%; background: var(--muted); border-radius: 3px; }
  #hint {
    position: absolute; left: 0; right: 0; top: calc(50% + 120px);
    text-align: center; color: var(--muted); font-size: 15px; padding: 0 24px;
    transition: opacity .6s; min-height: 20px;
  }

  /* 3D sloth canvas sits above the card and button, below the intro */
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  #zzz { position: absolute; left: 0; top: 0; z-index: 6; font-weight: 800; color: var(--muted); font-size: 22px; pointer-events: none; opacity: 0; }
  #zzz.on { animation: zzz 5s ease-in-out infinite; }
  @keyframes zzz { 0% { opacity: 0; margin: 10px 0 0 0; transform: scale(.7) } 30% { opacity: .9 } 100% { opacity: 0; margin: -34px 0 0 14px; transform: scale(1.2) } }

  /* Stop button */
  #stop {
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 7dvh);
    width: min(60vw, 230px); height: 70px; margin-left: calc(min(60vw, 230px) / -2);
    border: 0; border-radius: 22px; background: var(--accent); color: #fff;
    font: 800 24px/1 -apple-system, system-ui, sans-serif; letter-spacing: .12em;
    box-shadow: 0 8px 0 #9c3532, 0 14px 24px rgba(0,0,0,.25);
    transform: translateY(220%); transition: transform .9s cubic-bezier(.2,.8,.2,1);
    touch-action: manipulation; cursor: pointer; z-index: 2;
  }
  #stop.show { transform: translateY(0); }
  #stop:active { box-shadow: 0 3px 0 #9c3532; margin-top: 5px; }
  #stop:disabled { background: #7b6f64; box-shadow: 0 8px 0 #5a5047; color: #e7ddd2; cursor: default; }

  #restart {
    position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 16px); text-align: center; z-index: 6;
    color: var(--muted); font-size: 15px; text-decoration: underline; opacity: 0; pointer-events: none; transition: opacity .6s;
  }
  #restart.show { opacity: 1; pointer-events: auto; }

  /* Intro overlay */
  #intro {
    position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(243,230,207,.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    color: #3b2f26; text-align: center; padding: 32px; gap: 8px; transition: opacity .5s;
  }
  @media (prefers-color-scheme: dark) { #intro { background: rgba(31,26,22,.82); color: #f3e6cf; } }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro h1 { margin: 0; font-size: 34px; }
  #intro p { margin: 0; opacity: .75; font-size: 16px; max-width: 260px; }
  #intro .go { margin-top: 18px; padding: 14px 30px; border-radius: 99px; background: var(--card); color: #f8ecd6; font-weight: 700; font-size: 17px; }

  #debug { position: absolute; left: 6px; bottom: 4px; font: 11px/1.3 ui-monospace, monospace; color: var(--muted); white-space: pre; pointer-events: none; z-index: 7; }
</style>
</head>
<body>
<div id="app">
  <div id="restart">Restart</div>

  <div id="card">
    <div id="time">00:00<small>.00</small></div>
  </div>

  <div id="grip" aria-hidden="true"><span></span></div>
  <div id="hint">Shake the phone to wake him up</div>

  <button id="stop" type="button">STOP</button>

  <canvas id="gl" aria-label="A sleepy sloth"></canvas>
  <div id="zzz">z z Z</div>
  <div id="debug"></div>

  <div id="intro">
    <h1>Slowth</h1>
    <p>The timer is already running. A very sleepy sloth is lying on it.</p>
    <div class="go">Tap to start</div>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const card = $('card'), timeEl = $('time'), hint = $('hint'), zzz = $('zzz');
const stopBtn = $('stop'), restartEl = $('restart'), intro = $('intro'), dbg = $('debug');
const DEBUG = /[?&]debug/.test(location.search);

/* ---------- 3D sloth (optional: the timer still works if WebGL / the CDN is unavailable) ---------- */
let sloth = null, LIFT = 24;
try {
  const mod = await import('./sloth/index.js');
  LIFT = mod.LIFT;
  sloth = mod.createSloth($('gl'));
} catch (err) {
  console.error('Sloth failed to load', err);
  hint.textContent = 'The sloth could not be loaded (needs WebGL). The timer still works.';
}

/* ---------- Timer (count up, starts on load) ---------- */
let t0 = performance.now(), frozen = null;
const pad = n => String(n).padStart(2, '0');
function fmt(ms) {
  const cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60,
        m = Math.floor(ms / 60000) % 60, h = Math.floor(ms / 3600000);
  return (h ? h + ':' : '') + pad(m) + ':' + pad(s) + '<small>.' + pad(cs) + '</small>';
}

/* ---------- State ---------- */
// intro -> sleeping -> waking -> awake -> (dangling -> awake | falling) -> landed -> stopped
let state = 'intro', stateT = 0;
let x = 0, v = 0, rot = 0;                    // x offset from card centre (px)
let tilt = 0, rawTilt = 0, manualTilt = 0;
let grip = 1, wasFighting = false, lastPull = 0, shakeUntil = 0;
const gripEl = $('grip'), gripFill = gripEl.firstElementChild;
let fall = null, dang = null;
const cur = { cx: 0, cy: 0, rot: 0 };         // latest rendered body pose (so a fall starts where he let go)
const setHint = (txt) => { hint.style.opacity = 0; setTimeout(() => { hint.textContent = txt; hint.style.opacity = 1; }, 300); };

function enter(s) {
  state = s; stateT = 0;
  if (s === 'sleeping') { fall = null; dang = null; }
  if (s === 'waking')   { setHint('mmm… he is waking up'); setTimeout(() => state === 'waking' && enter('awake'), 3000); }
  if (s === 'awake')    { setHint('Tilt the phone to slide him off'); v = 0; grip = 1; wasFighting = false; gripEl.classList.add('show'); }
  if (s === 'dangling') {
    const dir = x >= 0 ? 1 : -1;
    dang = { dir, t: 0, blend: 0, sw: dir * 0.35, swv: dir * 1.6, level: 0, rescue: false, rt: 0, releasing: false, relT: 0, x0: x, xr: dir * (restPoint().half - 46) };
    grip = Math.max(grip, 0.85); setHint("He's hanging on by one claw! Level the phone to save him");
  }
  if (s === 'falling')  { gripEl.classList.remove('show'); startFall(); setHint(''); }
  if (s === 'landed')   { setHint(frozen === null ? 'Press STOP to stop the timer' : ''); }
}

/* ---------- Sensors ---------- */
let lastMag = null, shakeHits = [], lastStir = 0;
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  const mag = Math.hypot(a.x, a.y, a.z);
  if (lastMag !== null) {
    const d = Math.abs(mag - lastMag), now = performance.now();
    if (d > 14) { shakeHits.push(now); shakeHits = shakeHits.filter(t => now - t < 1000); if (shakeHits.length >= 3) { shakeHits = []; wake(); } }
    else if (d > 6 && state === 'sleeping' && now - lastStir > 6000) { lastStir = now; shakeUntil = now + 4000; }
  }
  lastMag = mag;
}
function onOrient(e) { if (e.gamma != null) rawTilt = e.gamma; }
addEventListener('devicemotion', onMotion);
addEventListener('deviceorientation', onOrient);

async function enableSensors() {
  try {
    const reqs = [];
    if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) reqs.push(DeviceMotionEvent.requestPermission());
    if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) reqs.push(DeviceOrientationEvent.requestPermission());
    await Promise.all(reqs);
  } catch (_) { /* denied: fallbacks (double-tap / keys / drag) still work */ }
}

function wake() { if (state === 'sleeping') enter('waking'); }

/* ---------- Fallback controls ---------- */
intro.addEventListener('click', () => { enableSensors(); intro.classList.add('gone'); if (state === 'intro') enter('sleeping'); setHint('Shake the phone to wake him up'); });
addEventListener('dblclick', wake);
let lastTap = 0;
addEventListener('pointerdown', e => {
  if (e.target === stopBtn) return;
  const n = performance.now(); if (n - lastTap < 350) wake(); lastTap = n;
});
const keys = {};
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') keys.l = 1; if (e.key === 'ArrowRight') keys.r = 1;
  if (e.key === ' ' || e.key === 'w') wake();
  manualTilt = (keys.r ? 28 : 0) - (keys.l ? 28 : 0);
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keys.l = 0; if (e.key === 'ArrowRight') keys.r = 0;
  manualTilt = (keys.r ? 28 : 0) - (keys.l ? 28 : 0);
});
let dragX0 = null;
addEventListener('pointerdown', e => { if (e.target !== stopBtn) dragX0 = e.clientX; });
addEventListener('pointermove', e => { if (dragX0 !== null && e.pointerType === 'mouse' && e.buttons) manualTilt = Math.max(-30, Math.min(30, (e.clientX - dragX0) / 3)); });
addEventListener('pointerup', () => { dragX0 = null; manualTilt = (keys.r ? 28 : 0) - (keys.l ? 28 : 0); });

/* ---------- STOP / Restart ---------- */
stopBtn.addEventListener('click', () => {
  if (frozen !== null) return;
  frozen = performance.now() - t0;
  timeEl.innerHTML = fmt(frozen);
  card.classList.add('stopped');
  stopBtn.disabled = true; stopBtn.textContent = 'STOPPED';
  restartEl.classList.add('show');
  if (state === 'landed') setHint('');
});
restartEl.addEventListener('click', () => {
  frozen = null; t0 = performance.now(); fall = null; dang = null; grip = 1; x = 0; v = 0; rot = 0;
  card.classList.remove('stopped'); stopBtn.disabled = false; stopBtn.textContent = 'STOP';
  stopBtn.classList.remove('show'); restartEl.classList.remove('show');
  sloth && sloth.reset();
  enter('sleeping'); setHint('Shake the phone to wake him up');
});

/* ---------- Geometry ---------- */
function restPoint() { const r = card.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top, half: r.width / 2 }; }
function buttonTop() { // top edge of the STOP button in its final (shown) position, from layout not transform
  const bottomGap = parseFloat(getComputedStyle(stopBtn).bottom);
  return $('app').clientHeight - bottomGap - stopBtn.offsetHeight;
}
function startFall() {
  const btnTop = buttonTop();
  fall = { t0: performance.now(), dur: 2400, x0: cur.cx, y0: cur.cy, x1: innerWidth / 2, y1: btnTop - LIFT + 4, dir: x >= 0 ? 1 : -1, rot0: cur.rot };
}

/* ---------- Main loop ---------- */
let last = performance.now(), fps = 60;
let pxPrev = null, pyPrev = null;
const sm = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  stateT += dt;
  if (dt > 0) fps += (1 / dt - fps) * 0.05;

  if (frozen === null) timeEl.innerHTML = fmt(now - t0);

  // tilt smoothing (low-pass) – the sloth is lazy about everything
  const target = manualTilt || rawTilt;
  tilt += (target - tilt) * Math.min(1, dt * 3);

  const p = restPoint();
  const surf = { cx: p.x, top: p.y, half: p.half };
  let cx = p.x + x, cy = p.y - LIFT, rotOut = 0;
  let level = 0, up = 0, gripOn = false, hang = null, releasing = false, squash = 1, slide = 0;
  let shadow = { x: cx, y: p.y + 16, w: 220, h: 50, a: 0.4 };
  let surface = surf;

  if (state === 'awake') {
    gripOn = true;
    const dead = 8, over = Math.abs(tilt) - dead;
    const dir = Math.sign(tilt);
    let force = 0, fighting = false, panic = false;
    let pullK;
    if (over > 0) {
      // He fights back: the grip drains while you keep tilting, and he surges against you in pulses.
      grip = Math.max(0, grip - dt * (0.07 + over * 0.01));
      const resist = grip * (0.88 + 0.12 * Math.sin(now / 140));
      force = dir * over * 7 * (1.05 - resist * 0.9);
      pullK = 2.2 * resist;
      fighting = grip > 0.3; panic = !fighting;
      up = -dir; slide = dir;
    } else {
      grip = Math.min(1, grip + dt * 0.22);             // he recovers when you stop
      pullK = 2.2 * Math.max(0.5, grip);
      if (Math.abs(x) > 6) up = -Math.sign(x);          // claws haul him hand-over-hand back toward the middle
    }
    level = panic ? 2 : fighting ? 1 : 0;
    if (fighting && !wasFighting) setHint('He is holding on! Keep tilting!');
    if (!fighting && !panic && wasFighting) setHint('Tilt the phone to slide him off');
    wasFighting = fighting || panic;
    force += pullK * lastPull;
    v += (force - v * 2.6) * dt;
    x += v * dt;
    const effort = over > 0 ? 0.4 + (1 - grip) * 0.6 : 0;
    const rotTarget = over > 0 ? (-dir * 6 * grip + dir * 8 * (1 - grip)) : tilt * 0.25;
    rot += (rotTarget - rot) * Math.min(1, dt * 3);
    gripFill.style.width = (grip * 100).toFixed(0) + '%';
    if (Math.abs(x) > p.half - 14) enter('dangling');
    cx = p.x + x + (Math.random() - .5) * 4 * effort * (fighting ? 1 : 1.6);
    cy = p.y - LIFT + (Math.random() - .5) * 2.2 * effort;
    rotOut = rot;
    shadow.x = p.x + x;
  } else if (state === 'dangling' && dang) {
    const D = dang; D.t += dt;
    level = 2;
    if (!D.rescue) {
      D.blend = Math.min(1, D.blend + dt / 0.7);
      D.swv += (-18 * Math.sin(D.sw) - 1.1 * D.swv + tilt * 0.035 + (Math.random() - .5) * 0.5) * dt;
      D.sw = Math.max(-1.2, Math.min(1.2, D.sw + D.swv * dt));
      const tiltOn = Math.abs(tilt) > 9;
      if (tiltOn) { D.level = Math.max(0, D.level - dt * 1.5); grip = Math.max(0, grip - dt * 0.2); }
      else { D.level += dt; grip = Math.min(1, grip + dt * 0.1); }
      if (D.level > 1.1) { D.rescue = true; D.rt = 0; setHint('Phew… he is hauling himself back up'); }
      else if (grip <= 0.1 && !D.releasing) { D.releasing = true; D.relT = 0; }
      if (D.releasing) { D.relT += dt; if (D.relT > 0.5) enter('falling'); }
    } else {
      D.rt += dt; D.blend = Math.max(0, 1 - D.rt / 0.9);
      if (D.rt >= 0.9) { x = D.xr; v = 0; rot = 0; enter('awake'); grip = 0.45; }
    }
    if (state === 'dangling') {
      const e = sm(D.blend);
      const pivot = { x: p.x + D.dir * p.half, y: p.y + 4 };
      const Lh = 96;
      const hcx = pivot.x - D.dir * 38 + Lh * Math.sin(D.sw), hcy = pivot.y + Lh * Math.cos(D.sw);
      const hrot = -90 - D.sw * 180 / Math.PI;
      const xa = D.rescue ? D.xr : D.x0;
      cx = lerp(p.x + xa, hcx, e); cy = lerp(p.y - LIFT, hcy, e); rotOut = lerp(0, hrot, e);
      hang = { x: pivot.x, y: pivot.y + 6 };
      releasing = D.releasing;
      gripFill.style.width = (grip * 100).toFixed(0) + '%';
      shadow = { x: p.x + xa, y: p.y + 16, w: 220, h: 50, a: 0.4 * (1 - e) };
    }
  } else if (state === 'falling' && fall) {
    level = 2;
    const t = Math.min(1, (now - fall.t0) / fall.dur);
    const ey = t * t * (0.6 + 0.4 * t);                 // slow start, floaty accel
    const ex = 1 - Math.pow(1 - t, 2);
    cx = fall.x0 + (fall.x1 - fall.x0) * ex;
    cy = fall.y0 + (fall.y1 - fall.y0) * ey;
    rotOut = fall.dir * 28 * Math.sin(t * Math.PI * 0.95) + (1 - t) * fall.rot0;
    rot = rotOut;
    shadow.a = 0;
    if (t > 0.5 && !stopBtn.classList.contains('show')) stopBtn.classList.add('show');
    if (t >= 1) { rot = 0; enter('landed'); }
  } else if (state === 'landed') {
    const bt = buttonTop();
    cx = innerWidth / 2; cy = bt - LIFT + 4;
    surface = { cx: innerWidth / 2, top: bt, half: stopBtn.offsetWidth / 2 };
    rot += (0 - rot) * Math.min(1, dt * 4); rotOut = rot;
    squash = 1 - 0.2 * Math.exp(-stateT * 4.5) * Math.cos(stateT * 8);
    shadow = { x: cx, y: bt + 14, w: 200, h: 40, a: 0.3 };
  } else {
    rot += (0 - rot) * Math.min(1, dt * 3); rotOut = rot;
    cx = p.x + x;
  }

  cur.cx = cx; cur.cy = cy; cur.rot = rotOut;
  const vx = pxPrev === null ? 0 : (cx - pxPrev) / Math.max(dt, 1e-3), vy = pyPrev === null ? 0 : (cy - pyPrev) / Math.max(dt, 1e-3);
  pxPrev = cx; pyPrev = cy;

  if (sloth) {
    const out = sloth.update(dt, {
      state, cx, cy, rot: rotOut, squash, surface, shadow,
      up, slide, level, tilt, gripOn, hang, releasing, dir: dang ? dang.dir : 1,
      vx, vy, shakeStir: now < shakeUntil,
    });
    lastPull = out.pull;
    zzz.classList.toggle('on', state === 'sleeping' || (state === 'landed' && stateT > 4));
    zzz.style.left = (out.head.x + 14).toFixed(0) + 'px'; zzz.style.top = (out.head.y - 32).toFixed(0) + 'px';
  }

  hint.style.top = (p.y + card.offsetHeight + 28) + 'px';
  gripEl.style.top = (p.y + card.offsetHeight + 62) + 'px';

  if (DEBUG) dbg.textContent = `state ${state}  fps ${fps.toFixed(0)}\ntilt ${tilt.toFixed(1)} grip ${grip.toFixed(2)}\nx ${x.toFixed(1)} v ${v.toFixed(1)} pull ${lastPull.toFixed(1)}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// expose for testing
window.__slowth = {
  get state() { return state; }, get grip() { return grip; }, get x() { return x; }, get fps() { return fps; },
  get dang() { return dang; }, wake, setTilt(d) { manualTilt = d; }, setX(nx) { x = nx; v = 0; },
};
</script>
</body>
</html>
